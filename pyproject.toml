# Lint settings for `ruff check .` (run by CI on every pull request).
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fixture-heavy test lines run long; everything else applies.
"tests/*" = ["E501"]
